name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gets-modes-toolkit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases (easy phone download)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GETS-MODES-TOOLKIT.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GETS-MODES-TOOLKIT.apk \
            --title "Latest build" \
            --notes "Debug APK built from commit ${{ github.sha }}" \
            --prerelease
